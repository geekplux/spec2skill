openapi: 3.0.3
info: { title: Nullable, version: '1' }
paths: {}
components:
  schemas:
    Owner:
      type: object
      properties: { name: { type: string } }
    Thing:
      type: object
      required: [id]
      properties:
        id: { type: string }
        note: { type: string, nullable: true }
        count: { type: integer, nullable: true, format: int32 }
        owner:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Owner' }]
        tags: { type: array, nullable: true, items: { type: string } }
        kind: { type: string, enum: [a] }
