# CI for the petstore-api skill: regression tests, every worked example (dry run) and the audit.
# Move this file to .github/workflows/ to run it on GitHub.
name: petstore-api skill
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test scripts/*.test.mjs
      - run: node examples/find-pets-by-status-to-get-pet-by-id/run.mjs
      - run: node examples/find-pets-by-status-to-update-pet-with-form/run.mjs
      - run: node scripts/audit.mjs .
