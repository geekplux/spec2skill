<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Turn any OpenAPI spec or MCP server into an agent skill in one click. Check what it teaches on a map of every operation." />
    <meta property="og:title" content="spec2skill" />
    <meta property="og:description" content="Turn any OpenAPI spec or MCP server into an agent skill in one click." />
    <!-- Link previews (Open Graph, X): a 1200 × 630 card, and the same card moving as og:video for the
         platforms that play it (iMessage, Discord); the rest show og:image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="spec2skill" />
    <meta property="og:url" content="https://spec2skill.geekplux.com/" />
    <meta property="og:image" content="https://spec2skill.geekplux.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="spec2skill: turn any API into an agent skill, above a map of its operations grouped by resource." />
    <meta property="og:video" content="https://spec2skill.geekplux.com/og.mp4" />
    <meta property="og:video:secure_url" content="https://spec2skill.geekplux.com/og.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1200" />
    <meta property="og:video:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <script>
      // A stored theme (src/design/theme.ts) is pinned before the first paint, so it never flashes.
      (function () {
        try {
          var theme = localStorage.getItem('spec2skill:theme');
          if (theme !== 'light' && theme !== 'dark') return;
          document.documentElement.dataset.theme = theme;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) { meta.content = theme === 'dark' ? '#111111' : '#fcfcfc'; });
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>spec2skill: turn any OpenAPI spec or MCP server into an agent skill</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
