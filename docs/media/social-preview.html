<!doctype html>
<!-- The repository's social preview card (1280x640). Rendered to docs/social-preview.png by
     `node scripts/social-preview.mjs` (part of `pnpm capture:readme`); it crops docs/media/hero.png.
     The Route map identity (docs/DESIGN.md): Radix gray and indigo light values, IBM Plex, 0.5 px rings. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>spec2skill social preview</title>
<style>
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2') format('woff2');
    font-weight: 400;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2') format('woff2');
    font-weight: 600;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
    font-weight: 400;
  }
  :root { --gray-1: #fcfcfc; --gray-7: #cecece; --gray-11: #646464; --gray-12: #202020; --indigo-11: #3a5bc7; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: var(--gray-1);
    color: var(--gray-12);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-feature-settings: "tnum";
    display: grid;
    grid-template-columns: 440px 1fr;
    gap: 64px;
    padding: 72px 0 0 72px;
  }
  .words { display: flex; flex-direction: column; gap: 32px; padding-bottom: 72px; }
  .words img { width: 188px; height: auto; }
  h1 { font-size: 48px; line-height: 52px; font-weight: 600; letter-spacing: -0.035em; text-wrap: balance; }
  ul { list-style: none; padding: 0; display: grid; gap: 8px; font-size: 20px; line-height: 28px; color: var(--gray-11); }
  code { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 18px; color: var(--indigo-11); }
  .foot { margin-top: auto; font-size: 20px; line-height: 28px; color: var(--gray-11); }
  /* The hero (V2Hover, 1440x1250) at 80 %: Members, Labels and Tasks with getTask hovered, its links in
     ink and its operation card, from the tools row down. */
  .shot {
    align-self: start;
    height: 568px;
    overflow: hidden;
    border-radius: 16px 0 0 0;
    box-shadow: inset 0 0 0 0.5px var(--gray-7);
  }
  .shot img { display: block; width: 1152px; max-width: none; margin: -400px 0 0 -347px; }
</style>
</head>
<body>
  <div class="words">
    <img src="wordmark.svg" alt="spec2skill">
    <h1>Turn any API into an agent skill</h1>
    <ul>
      <li>OpenAPI 3.x, Swagger 2.0 and MCP</li>
      <li>Inferred workflows: outputs feed inputs</li>
      <li>Tests, evals and <code>audit passed</code> inside</li>
      <li>A route map to check what it teaches</li>
    </ul>
    <p class="foot">Open source, MIT licence, works offline</p>
  </div>
  <div class="shot"><img src="hero.png" alt=""></div>
</body>
</html>
