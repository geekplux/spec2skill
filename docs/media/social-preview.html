<!doctype html>
<!-- The repository's social preview card (1280x640). Rendered to docs/social-preview.png by
     `node scripts/social-preview.mjs` (part of `pnpm capture:readme`); it crops docs/media/hero.png.
     The Route map identity (docs/DESIGN.md): Radix gray and indigo light values, IBM Plex, 0.5 px rings. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>spec2skill social preview</title>
<style>
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2') format('woff2');
    font-weight: 400;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2') format('woff2');
    font-weight: 600;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
    font-weight: 400;
  }
  :root { --gray-1: #fcfcfc; --gray-7: #cecece; --gray-11: #646464; --gray-12: #202020; --indigo-11: #3a5bc7; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: var(--gray-1);
    color: var(--gray-12);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-feature-settings: "tnum";
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 48px 72px 0;
  }
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 48px; }
  h1 { font-size: 48px; line-height: 52px; font-weight: 600; letter-spacing: -0.035em; white-space: nowrap; }
  .lede { margin-top: 8px; font-size: 20px; line-height: 28px; color: var(--gray-11); }
  code { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 20px; color: var(--indigo-11); }
  .mark { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  .mark img { width: 188px; height: auto; }
  .mark p { font-size: 14px; line-height: 20px; color: var(--gray-11); }
  /* The hero (V2Hover, 1440x1250) at 100 %: the result frame (152 to 1288, exactly this box's width)
     from just above the map's cards (y 576) to the blank under the workflow caption (y 1056), so the
     crop runs along the frame's sides and through empty space, never through a card or a line of text. */
  .shot {
    flex: 1;
    overflow: hidden;
    border-radius: 16px 16px 0 0;
    box-shadow: inset 0 0 0 0.5px var(--gray-7);
  }
  .shot img { display: block; width: 1440px; max-width: none; margin: -576px 0 0 -152px; }
</style>
</head>
<body>
  <div class="top">
    <div>
      <h1>Turn any API into an agent skill</h1>
      <p class="lede">OpenAPI, Swagger or MCP in; a tested skill with <code>audit passed</code> and a route map out.</p>
    </div>
    <div class="mark">
      <img src="wordmark.svg" alt="spec2skill">
      <p>Open source, MIT licence, works offline</p>
    </div>
  </div>
  <div class="shot"><img src="hero.png" alt=""></div>
</body>
</html>
