# CI: lint, typecheck, tests, build and the checks below, on every push to main and every pull request.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test # includes the docs link check (pnpm test:docs)
      - run: pnpm build
      - run: pnpm check:size
      - name: Headless-browser check (runner's google-chrome)
        run: pnpm check:browser -- --phase 21 # every flow, the redesign acceptance suite included
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: CLI writes and audits a sample skill
        run: |
          pnpm build:cli
          node dist-cli/spec2skill.mjs --sample tasks --out "$RUNNER_TEMP"
      - name: Examples gallery is up to date
        run: pnpm gallery --check
      - name: Every example skill passes its own tests and audit
        run: |
          for dir in examples/*/; do
            (cd "$dir" && node --test scripts/*.test.mjs && node scripts/audit.mjs .)
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshots/
